name: Deploy productos to EC2

on:
  push:
    branches: ["develop"]
    paths:
      - "**"
  workflow_dispatch:

env:
  IMAGE_NAME: productos

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./back/productos
          file: ./back/productos/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ORACLE_DB_USERNAME: ${{ secrets.ORACLE_DB_USERNAME }}
          ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # 1) write env file for productos service
            cat > ~/productos.env <<EOF
            ORACLE_DB_USERNAME=${{ secrets.ORACLE_DB_USERNAME }}
            ORACLE_DB_PASSWORD=${{ secrets.ORACLE_DB_PASSWORD }}
            EOF
            chmod 600 ~/productos.env

            # 2) docker login & pull latest image
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # 3) stop existing container if running
            docker stop productos || true && docker rm productos || true

            # 4) run new container bound to localhost 8081
            docker run -d --name productos \
              -p 127.0.0.1:8081:8081 \
              --restart=always \
              --env-file ~/productos.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # 5) reload nginx (if routing through gateway) – optional
            sudo systemctl reload nginx || true
