# Configuración general de la aplicación
spring.application.name=productos
server.port=8081
server.servlet.context-path=/api

# Configuración de la conexión a Oracle Cloud con Wallet
spring.datasource.url=jdbc:oracle:thin:@c3cq5y7aelcsqgmu_medium?TNS_ADMIN=./Wallet_C3CQ5Y7AELCSQGMU
# Usando propiedades de archivo externo (application-secrets.properties)
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Configuración de logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.rabbithole=DEBUG
spring.kafka.bootstrap-servers=localhost:29092,localhost:39092,localhost:49092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Limitar conexiones para Oracle Free
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000